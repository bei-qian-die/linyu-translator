<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>linyu preview</title><style>body {
  font-family: "PingFang SC", "HarmonyOS Sans SC", "MiSans", "Microsoft YaHei", system-ui, sans-serif;
  background: #f7f5f1;
  color: #141414;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}

button {
  padding: 0;
  margin: 0;
  background: transparent;
  border-radius: 0;
  line-height: 1.4;
  font-size: 14px;
  color: inherit;
}

button::after {
  border: none;
}

.page {
  --bg: #f7f5f1;
  --ink: #141414;
  --muted: #6d6861;
  --faint: #746e65;
  --soft: #efece6;
  --line: rgba(20, 20, 20, 0.14);
  --line-strong: rgba(20, 20, 20, 0.5);
  --accent: #141414;
  --cta-bg: #141414;
  --cta-fg: #f7f5f1;
  --danger: #a33232;
  --placeholder: #746e65;

  min-height: 100vh;
  padding: 18px 22px 36px;
  background: var(--bg);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.6;
}

.theme-black {
  --bg: #111112;
  --ink: #f2efe9;
  --muted: #99948b;
  --faint: #8a857e;
  --soft: #1c1c1f;
  --line: rgba(242, 239, 233, 0.16);
  --line-strong: rgba(242, 239, 233, 0.55);
  --accent: #ff6f9c;
  --cta-bg: #f2efe9;
  --cta-fg: #111112;
  --danger: #ff8b8b;
  --placeholder: #8a857e;
}

.theme-rose {
  --bg: #fbf2f3;
  --ink: #2a1b20;
  --muted: #7e5c66;
  --faint: #8a6670;
  --soft: #f4e6e9;
  --line: rgba(42, 27, 32, 0.15);
  --line-strong: rgba(42, 27, 32, 0.5);
  --accent: #c2185b;
  --cta-bg: #c2185b;
  --cta-fg: #fff7f8;
  --danger: #a3183f;
  --placeholder: #8a6670;
}

.eyebrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.5;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.eyebrow-left {
  display: flex;
  align-items: center;
  min-width: 0;
}

.eyebrow-mark {
  padding: 0 3px;
  color: var(--accent);
}

.eyebrow-arrow {
  padding: 0 4px;
  color: var(--accent);
}

.eyebrow-right {
  flex: none;
  color: var(--faint);
  letter-spacing: 0.06em;
}

.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 12px;
}

.page-title {
  font-size: 28px;
  font-weight: 600;
  line-height: 1.36;
  letter-spacing: 0.005em;
  color: var(--ink);
}

.page-title .pt-line {
  display: block;
}

.pt-dot {
  color: var(--accent);
}

.page-sub {
  margin-top: 7px;
  font-size: 9px;
  line-height: 1.6;
  letter-spacing: 0.03em;
  color: var(--faint);
}

.btn-primary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 58px;
  border-radius: 14px;
  background: var(--cta-bg);
  color: var(--cta-fg);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 1.6px;
}

.btn-primary.disabled {
  opacity: 0.4;
}

.btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 44px;
  padding: 0 15px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: transparent;
  color: var(--ink);
  font-size: 12px;
  line-height: 1;
  white-space: nowrap;
}

.btn-ghost.danger {
  color: var(--danger);
  border-color: var(--line);
}

.btn-ghost.disabled {
  opacity: 0.35;
}

.search-box {
  display: flex;
  align-items: center;
  height: 42px;
  margin-bottom: 10px;
  padding: 0;
  border: 0;
  border-bottom: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
}

.search-ico {
  position: relative;
  flex: none;
  width: 13px;
  height: 13px;
  margin-right: 10px;
  border: 1.5px solid var(--faint);
  border-radius: 50%;
}

.search-ico::after {
  content: '';
  position: absolute;
  right: -5px;
  bottom: -4px;
  width: 2px;
  height: 8px;
  border-radius: 1px;
  background: var(--faint);
  transform: rotate(-45deg);
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 42px;
  font-size: 12.5px;
  color: var(--ink);
}

.search-clear {
  flex: none;
  min-width: 28px;
  padding: 8px 0 8px 10px;
  color: var(--faint);
  font-size: 11px;
  text-align: right;
}

.placeholder {
  color: var(--placeholder);
}

.chip {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  min-height: 36px;
  padding: 0 12px;
  margin-right: 8px;
  border: 1px solid var(--line);
  border-radius: 499.5px;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  line-height: 1;
}

.chip.on {
  border-color: var(--accent);
  color: var(--accent);
  font-weight: 600;
}

.chip-count {
  margin-left: 4px;
  font-size: 9px;
  opacity: 0.7;
}

.h-tag {
  display: inline;
  margin: 0 6px 0 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--faint);
  font-size: 9px;
  line-height: 1.8;
  letter-spacing: 0.04em;
}

.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 12px 48px;
  color: var(--muted);
  text-align: center;
}

.empty-ico {
  width: auto;
  height: auto;
  margin-bottom: 13px;
  background: none;
  border: 0;
  border-radius: 0;
  color: var(--accent);
  font-size: 28px;
  line-height: 1;
}

.empty-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
}

.empty-sub {
  margin-top: 5px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
}

.empty .btn-primary {
  width: 140px;
  height: 42px;
  margin-top: 16px;
  border-radius: 10px;
  font-size: 12px;
}

.load-more {
  margin: 0;
  padding: 15px 0;
  border: 0;
  border-radius: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--accent);
}

.list-end {
  padding: 15px 0;
  text-align: center;
  font-size: 9px;
  letter-spacing: 0.06em;
  color: var(--faint);
}

.tip {
  margin: 16px 4px 0;
  text-align: center;
  font-size: 9px;
  line-height: 1.9;
  letter-spacing: 0.04em;
  color: var(--faint);
}

.dot {
  display: inline-block;
  width: 3px;
  height: 3px;
  margin: 0 5px 2px 0;
  border-radius: 50%;
  background: var(--accent);
}

.section-label {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin: 20px 0 5px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  color: var(--ink);
}

.tap-soft {
  background: var(--soft);
}

.word-list,
.rule-list,
.lore-list,
.card-list,
.quote-list,
.hero-list {
  display: flex;
  flex-direction: column;
}

.word-card,
.rule-card,
.lore-card,
.quote-card {
  position: relative;
  margin: 0;
  padding: 13px 0;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  box-shadow: none;
  overflow: visible;
}

.word-main,
.word-line {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
}

.word-zh {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
  word-break: break-all;
}

.word-arrow {
  margin: 0 7px;
  font-size: 10px;
  color: var(--faint);
}

.word-ly {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--accent);
  word-break: break-all;
}

.word-alias {
  margin-top: 3px;
  font-size: 10px;
  color: var(--faint);
}

.word-sense {
  margin-top: 4px;
  font-size: 11.5px;
  line-height: 1.7;
  color: var(--muted);
  word-break: break-all;
}

.word-meta {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  margin-top: 4px;
}

.word-src {
  font-size: 9px;
  line-height: 1.7;
  color: var(--faint);
  word-break: break-all;
}

.rule-head,
.lore-card-head,
.lore-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  margin-bottom: 4px;
}

.rule-id {
  margin-right: 6px;
  font-size: 8.5px;
  letter-spacing: 0.04em;
  color: var(--faint);
}

.rule-row {
  display: flex;
  align-items: flex-start;
  margin-top: 4px;
}

.rule-label {
  flex: none;
  width: 32px;
  margin-right: 8px;
  font-size: 9px;
  line-height: 1.9;
  color: var(--faint);
}

.rule-label.accent {
  color: var(--accent);
}

.rule-pattern {
  flex: 1;
  min-width: 0;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-family: Consolas, "Courier New", monospace;
  font-size: 10.5px;
  line-height: 1.7;
  word-break: break-all;
}

.rule-template {
  flex: 1;
  min-width: 0;
  font-size: 13px;
  font-weight: 500;
  line-height: 1.7;
  color: var(--ink);
  word-break: break-all;
}

.rule-example {
  margin-top: 5px;
  padding-left: 40px;
  font-size: 10.5px;
  line-height: 1.7;
  color: var(--muted);
  white-space: pre-wrap;
  word-break: break-all;
}

.lore-card::before {
  display: none;
}

.fc-type {
  display: inline;
  margin-right: 6px;
  padding: 0;
  border: 0;
  border-radius: 0;
  background: transparent;
  color: var(--accent);
  font-size: 9px;
  line-height: 1.8;
  letter-spacing: 0.08em;
}

.lore-term {
  margin-top: 2px;
  font-size: 16px;
  font-weight: 600;
  color: var(--accent);
  word-break: break-all;
}

.lore-alias {
  margin-top: 2px;
  font-size: 10px;
  color: var(--faint);
}

.lore-meaning {
  margin-top: 4px;
  font-size: 12px;
  line-height: 1.75;
  color: var(--ink);
  word-break: break-all;
}

.lore-example {
  margin-top: 5px;
  padding: 0 0 0 8px;
  border-left: 1px solid var(--line-strong);
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.7;
  word-break: break-all;
}

.lore-detail {
  margin-top: 4px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--muted);
  word-break: break-all;
}

.lore-source {
  margin-top: 4px;
  font-size: 9px;
  line-height: 1.7;
  color: var(--faint);
  word-break: break-all;
}

.q-text {
  position: relative;
  padding-top: 0;
  font-size: 14.5px;
  font-weight: 500;
  line-height: 1.8;
  color: var(--ink);
  word-break: break-all;
}

.q-meta {
  display: flex;
  flex-direction: column;
  margin-top: 6px;
}

.q-author {
  font-size: 10.5px;
  color: var(--accent);
}

.q-src {
  margin-top: 2px;
  font-size: 9px;
  line-height: 1.7;
  color: var(--faint);
  word-break: break-all;
}

.longpress-hint,
.tap-hint {
  padding: 6px 0 4px;
  text-align: center;
  font-size: 9px;
  line-height: 1.7;
  color: var(--faint);
}

.rise {
  animation: rise 0.24s ease-out both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(4px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .rise {
    animation: none;
  }
}

.live-toggle {
  display: flex;
  align-items: center;
  flex: none;
  min-height: 32px;
  padding: 5px 0 5px 12px;
  color: var(--faint);
  font-size: 8.5px;
  letter-spacing: 0.06em;
}

.live-dot {
  width: 4.5px;
  height: 4.5px;
  margin-right: 5px;
  border: 0.5px solid var(--faint);
  border-radius: 50%;
  background: transparent;
}

.live-toggle.on .live-dot {
  border-color: var(--accent);
  background: var(--accent);
}

.live-state {
  margin-left: 4px;
}

.live-toggle.on .live-state {
  color: var(--accent);
}

.headline {
  margin: 4px 0 36px;
  font-size: 42px;
  font-weight: 600;
  line-height: 1.28;
  letter-spacing: 0.005em;
  color: var(--ink);
}

.hl-line {
  display: block;
}

.field {
  margin-bottom: 22px;
  border-bottom: 1px solid var(--line-strong);
}

.field-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 28px;
  margin-bottom: 1px;
  font-size: 8.5px;
  letter-spacing: 0.12em;
  color: var(--faint);
  text-transform: uppercase;
}

.field-tools {
  display: flex;
  align-items: center;
}

.field-label {
  letter-spacing: 0.14em;
}

.field-op {
  margin-left: 6px;
  padding: 8px 4px;
  color: var(--muted);
  font-size: 9.5px;
  letter-spacing: 0.04em;
}

.field-count {
  flex: none;
  font-size: 8.5px;
  letter-spacing: 0.06em;
  color: var(--faint);
}

.input-area {
  width: 100%;
  height: 95px;
  padding: 0 0 10px;
  box-sizing: border-box;
  background: transparent;
  color: var(--ink);
  font-size: 21px;
  font-weight: 500;
  line-height: 1.5;
}

.input-placeholder {
  color: var(--faint);
  font-size: 16px;
  font-weight: 400;
  letter-spacing: 0.01em;
}

.samples {
  width: 100%;
  margin-bottom: 28px;
  white-space: nowrap;
}

.samples-inner {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
}

.samples-label {
  flex: none;
  margin-right: 7px;
  font-size: 8.5px;
  letter-spacing: 0.12em;
  color: var(--faint);
}

.sample {
  display: inline-flex;
  align-items: center;
  flex: none;
  min-height: 36px;
  margin-right: 6px;
  padding: 0 11px;
  border: 1px solid var(--line);
  border-radius: 499.5px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.4;
}

.translate-btn {
  border: 0;
  border-radius: 14px;
  background: var(--cta-bg);
  color: var(--cta-fg);
}

.cta-heart {
  margin-left: 8px;
  font-size: 13px;
  line-height: 1;
}

.cta-hover {
  opacity: 0.82;
}

/* 微信原生禁用态会覆盖背景与文字色，这里显式压回透明描边 */
.translate-btn[disabled] {
  border: 1px solid var(--line) !important;
  border-radius: 14px !important;
  background: transparent !important;
  color: var(--faint) !important;
  opacity: 1 !important;
  box-shadow: none !important;
  letter-spacing: 0.12em;
}

.result {
  margin-top: 36px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.result-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 11px;
}

.result-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  color: var(--ink);
}

.result-status {
  display: flex;
  align-items: center;
  flex: none;
  margin-left: 10px;
  font-size: 8.5px;
  letter-spacing: 0.06em;
  color: var(--faint);
}

.status-dot {
  width: 4px;
  height: 4px;
  margin-right: 5px;
  border-radius: 50%;
  background: var(--faint);
  opacity: 0.45;
}

.result-status.on .status-dot {
  background: var(--accent);
  opacity: 1;
}

.result-text {
  display: block;
  min-height: 95px;
  font-size: 22px;
  font-weight: 500;
  line-height: 1.7;
  letter-spacing: 0.01em;
  color: var(--ink);
  white-space: pre-wrap;
  word-break: break-all;
}

.result-text.is-hint {
  min-height: 75px;
  font-size: 15px;
  font-weight: 400;
  line-height: 1.7;
  letter-spacing: 0.02em;
  color: var(--faint);
}

.result-foot {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
}

.result-note {
  font-size: 8.5px;
  letter-spacing: 0.04em;
  color: var(--faint);
}

.result-actions {
  display: flex;
  align-items: center;
  flex: none;
  margin-left: 12px;
}

.result-act {
  display: inline-flex;
  align-items: center;
  height: 28px;
  margin-left: 15px;
  padding: 0 1px;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  line-height: 1;
  letter-spacing: 0.04em;
}

.result-act.act-hover {
  border-color: var(--accent);
  color: var(--accent);
}

.local-note {
  margin-top: 28px;
  padding: 16px 0 12px;
  text-align: center;
  font-size: 8.5px;
  line-height: 1.8;
  letter-spacing: 0.08em;
  color: var(--faint);
}


  html, body { margin: 0; padding: 0; background: #dcd9d3; }

    font-size: 17px;

  .cap-target::after { content: ''; position: absolute; inset: 2.5px; border-radius: 50%; background: currentColor; }
